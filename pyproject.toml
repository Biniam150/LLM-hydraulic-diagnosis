[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-hydraulic-diagnosis"
version = "0.1.0"
description = "Local LLM interpretation and hydraulic verification of water-distribution model discrepancies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "wntr==1.4.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "networkx==3.4.2",
]

[project.optional-dependencies]
classical = ["scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["wdn_diagnostics*", "experiments*"]
